# Salon CRM - Nginx config
# Tuned for 1 CPU / 4GB RAM VPS — cutnculturesalon.cloud

# Tune worker processes for 1 CPU
worker_processes 1;
worker_rlimit_nofile 1024;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/salon-crm.access.log;
    error_log  /var/log/nginx/salon-crm.error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip — reduces bandwidth on 1-core (CPU cost is low)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/x-javascript text/xml
        application/xml application/xml+rss
        image/svg+xml;

    # Rate limiting — protect the single core
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name cutnculturesalon.cloud www.cutnculturesalon.cloud;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name cutnculturesalon.cloud www.cutnculturesalon.cloud;

        # SSL — managed by certbot
        ssl_certificate /etc/letsencrypt/live/cutnculturesalon.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cutnculturesalon.cloud/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # SSL performance for low-resource server
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Frontend static files
        root /var/www/salon-crm/public;
        index index.html;

        # React SPA — serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Docker mode: uncomment below and comment out the root/try_files above
        # location / {
        #     proxy_pass http://127.0.0.1:3000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # Cache static assets aggressively (Vite hashes filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
            access_log off;
        }

        # Login rate limit
        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API proxy to Node.js backend
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Generous timeout for PDF/WhatsApp (Chrome can take 20-30s on 1 core)
            proxy_read_timeout 180s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;

            # Buffer settings for low-memory server
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Excel file uploads
            client_max_body_size 10m;
        }
    }
}
